name: Deploy React Vite (DEV)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: [self-hosted, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to FE VM
        run: |
          rsync -avz --delete dist/ \
          ubuntu@FE_VM_IP:/var/www/trello-frontend
